services:
  - type: web
    name: flora-transport-portal
    env: node
    plan: free
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL
        fromDatabase:
          name: flora-transport-db
          property: connectionString
      - key: DIRECT_URL
        fromDatabase:
          name: flora-transport-db
          property: connectionString
      - key: NEXTAUTH_URL
        sync: false
      - key: NEXTAUTH_SECRET
        generateValue: true

databases:
  - name: flora-transport-db
    plan: free
    databaseName: transport_bus
    user: transport_user
